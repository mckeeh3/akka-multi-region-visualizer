name: akka-multi-region-visualizer
service:
  env:
    - name: OPENAI_API_KEY
      valueFrom:
        secretKeyRef:
          key: OPENAI_API_KEY
          name: openai-api
    - name: MULTI_REGION_ROUTES
      valueFrom:
        secretKeyRef:
          key: MULTI_REGION_ROUTES
          name: multi-region-routes
  image: acr.aws-us-east-2.akka.io/mckeeh3/three-regions-demos/akka-multi-region-visualizer:1.0.0
  replication:
    mode: replicated-read
    replicatedRead:
      primarySelectionMode: request-region
